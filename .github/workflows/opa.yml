name: OPA Security Policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opa-policy:
    name: Test OPA policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install OPA
        run: |
          curl -L -O https://github.com/open-policy-agent/opa/releases/download/v1.21.0/opa_linux_amd64_static
          curl -L -O https://github.com/open-policy-agent/opa/releases/download/v1.21.0/opa_linux_amd64_static.sha256
          sha256sum -c opa_linux_amd64_static.sha256
          sudo install -m 0755 opa_linux_amd64_static /usr/local/bin/opa
          opa version

      - name: Test OPA policies
        run: |
          opa test policy/securechain.rego policy/test_securechain.rego -v

      - name: Run application tests
        id: pytest
        continue-on-error: true
        run: python -m pytest -q

      - name: Scan repository for secrets
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Build Docker image
        run: docker build -t secureshop:${{ github.sha }} .

      - name: Generate SBOM with Syft
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: secureshop:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Check SBOM generation
        id: sbom-check
        run: |
          if [ -s sbom.cyclonedx.json ]; then
            echo "SBOM generated successfully"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "SBOM generation failed"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan project dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secureshop:${{ github.sha }}
          format: json
          output: trivy-image.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Count Trivy vulnerabilities
        id: trivy-count
        run: |
          high=$(jq -s '
            [
              .[].Results[]?.Vulnerabilities[]?
              | select(.Severity == "HIGH")
              | {
                  id: .VulnerabilityID,
                  package: .PkgName,
                  version: .InstalledVersion
                }
            ]
            | unique
            | length
          ' trivy-fs.json trivy-image.json)

          critical=$(jq -s '
            [
              .[].Results[]?.Vulnerabilities[]?
              | select(.Severity == "CRITICAL")
              | {
                  id: .VulnerabilityID,
                  package: .PkgName,
                  version: .InstalledVersion
                }
            ]
            | unique
            | length
          ' trivy-fs.json trivy-image.json)

          echo "HIGH vulnerabilities: $high"
          echo "CRITICAL vulnerabilities: $critical"
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"

      - name: Generate CI input for OPA
        env:
          TESTS_PASSED: ${{ steps.pytest.outcome == 'success' }}
          SECRETS_FOUND: ${{ steps.gitleaks.outcome == 'success' && '0' || '1' }}
          HIGH_VULNERABILITIES: ${{ steps.trivy-count.outputs.high }}
          CRITICAL_VULNERABILITIES: ${{ steps.trivy-count.outputs.critical }}
          SBOM_GENERATED: ${{ steps.sbom-check.outputs.generated }}
          RUNS_AS_ROOT: "false"
        run: |
          python3 scripts/generate_opa_input.py
          cat policy/input-ci.json

      - name: Evaluate CI security decision
        run: |
          decision=$(opa eval \
            --format raw \
            --data policy/securechain.rego \
            --input policy/input-ci.json \
            "data.securechain.status")

          echo "Final CI decision: $decision"
          test "$decision" = "ALLOW"

      - name: Verify ALLOW decision
        run: |
          decision=$(opa eval \
            --format raw \
            --data policy/securechain.rego \
            --input policy/input-safe.json \
            "data.securechain.status")

          echo "Safe input decision: $decision"
          test "$decision" = "ALLOW"

      - name: Verify BLOCK decision
        run: |
          decision=$(opa eval \
            --format raw \
            --data policy/securechain.rego \
            --input policy/input-dangerous.json \
            "data.securechain.status")

          echo "Dangerous input decision: $decision"
          test "$decision" = "BLOCK"