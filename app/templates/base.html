<!doctype html>
<html lang="fr">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SecureShop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet">
  </head>
  <body>

      <div class="container">
        <a class="navbar-brand fw-bold" href="/">SecureShop</a>
        <span class="navbar-text text-light">SecureChain DevSecOps Lab</span>

    <main class="container py-5">{% block content %}{% endblock %}</main>

</html>
